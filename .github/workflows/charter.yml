name: charter

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  report-only:
    name: report-only (documented default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: janzong/agent-charters@v1
        with:
          path: AGENTS.md

  enforce:
    name: enforce (expected RED by design)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: janzong/agent-charters@v1
        with:
          path: AGENTS.md
          fail-on-missing: 'workflow,gotchas'

  pointer-follow:
    name: pointer-follow (CLAUDE.md is a pointer to AGENTS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # CLAUDE.md 全文只有 11 个字节：`@AGENTS.md`
      - id: ptr
        uses: janzong/agent-charters@v1
        with:
          path: CLAUDE.md
      # 断言走**公开输出**（消费方真正能用的接口），不去读 step summary ——
      # 踩过的坑：`GITHUB_STEP_SUMMARY` 是**每个 step 各一个**文件，
      # 后面的 step 读到的是自己那份空的（第一次就是这么假失败的）。
      - name: assert @v1 followed the pointer
        shell: bash
        env:
          FOLLOWED: ${{ steps.ptr.outputs.followed }}
          MISSING: ${{ steps.ptr.outputs.missing }}
        run: |
          set -euo pipefail
          echo "followed=$FOLLOWED"
          echo "missing=$MISSING"
          [ "$FOLLOWED" = "1" ]
          n=$(printf '%s' "$MISSING" | tr ',' '\n' | grep -c . || true)
          [ "$n" = "6" ]
          printf '%s' "$MISSING" | grep -q gotchas
          echo "OK: @v1 followed CLAUDE.md -> AGENTS.md (missing 6, not 9)"
